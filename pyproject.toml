[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-licitacoes"
version = "0.1.0"
description = "Agente de IA para consultar as licitações monitoradas do SENAC/AP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<2.0",
]

[project.scripts]
agente-licitacoes = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # warnings
    "I",    # ordenação de imports
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplificações
    "RET",  # retornos
    "PTH",  # pathlib
    "RUF",  # regras do próprio ruff
    "ASYNC", # armadilhas de async
    "DTZ",  # timezone
    "ISC",  # concatenação implícita
    "FURB", # refatorações sugeridas
    "PYI",  # anotações de tipo
]
ignore = [
    # O modelo de domínio usa campos com nomes da API pública (camelCase),
    # então a regra de naming não se aplica aos schemas.
    "N815",
    # `ProvedorLLM.fechar` é um hook opcional: nem todo provedor tem recurso a
    # liberar, então não deve ser abstrato obrigatório.
    "B027",
]
# "ℹ" é usado de propósito na saída da CLI.
allowed-confusables = ["ℹ"]
